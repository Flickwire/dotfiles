name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh
      - name: Validate shell files
        run: |
          set -euo pipefail
          shellcheck install.sh scripts/*.sh
          for script in install.sh scripts/*.sh; do
            bash -n "$script"
          done
          zsh -n .zshrc
      - name: Exercise supported OS dispatch
        run: |
          set -euo pipefail
          while read -r id version; do
            DOTFILES_DRY_RUN=1 DOTFILES_OS_ID="$id" DOTFILES_OS_VERSION_ID="$version" ./install.sh
          done <<'EOF'
          ubuntu 24.04
          ubuntu 26.04
          amzn 2023
          macos 15
          macos 26
          EOF

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run installer twice
        run: |
          set -euo pipefail
          ./install.sh
          ./install.sh
      - name: Validate installed configuration
        run: |
          set -euo pipefail
          bash scripts/validate-install.sh

  amazon-linux-2023:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run user data twice
        env:
          DOTFILES_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DOTFILES_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
        run: |
          set -euo pipefail
          docker run --privileged --name dotfiles-al2023 \
            --env DOTFILES_REF \
            --env DOTFILES_REPOSITORY \
            --volume "$PWD:/dotfiles:ro" \
            docker.io/library/amazonlinux@sha256:065856aabb1ddab0441f4024dfbba116cc760286858a53ec74e6a1218af979ee \
            bash /dotfiles/scripts/ec2-user-data-amazon-linux.sh
          docker start --attach dotfiles-al2023
          test "$(docker inspect --format '{{.State.ExitCode}}' dotfiles-al2023)" = 0
          docker commit dotfiles-al2023 dotfiles-al2023-verified
      - name: Validate SSM user environment
        env:
          DOTFILES_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --interactive --env DOTFILES_REF dotfiles-al2023-verified bash -s <<'EOF'
          set -euo pipefail
          test "$(getent passwd ssm-user | cut -d: -f7)" = "/usr/bin/zsh"
          test "$(stat -c %U /home/ssm-user/.local)" = "ssm-user"
          test "$(stat -c %U /home/ssm-user/.local/src/dotfiles)" = "ssm-user"
          visudo -cf /etc/sudoers.d/90-ssm-user-dotfiles >/dev/null
          test "$(runuser -u ssm-user -- env HOME=/home/ssm-user git -C /home/ssm-user/.local/src/dotfiles rev-parse HEAD)" = "$DOTFILES_REF"
          runuser -u ssm-user -- env \
            HOME=/home/ssm-user \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            bash -s <<'USER_EOF'
          set -euo pipefail
          test "$(sudo -n id -u)" = 0
          cd "$HOME/.local/src/dotfiles"
          bash scripts/validate-install.sh
          USER_EOF
          EOF
